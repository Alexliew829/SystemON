<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>启动倒数</title>
  <link rel="icon" href="/icon.png" />
  <link rel="apple-touch-icon" href="/icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="启动倒数" />
  <meta name="theme-color" content="#081725" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(180deg, #16344d 0%, #081725 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #eef8ff;
    }
    .card {
      width: min(92vw, 430px);
      text-align: center;
      padding: 32px 22px 26px;
      border-radius: 28px;
      background: rgba(8, 24, 40, 0.9);
      border: 1px solid rgba(124, 211, 255, 0.25);
      box-shadow: 0 18px 55px rgba(0,0,0,0.36);
    }
    .icon {
      width: 118px;
      height: 118px;
      border-radius: 28px;
      object-fit: cover;
      box-shadow: 0 0 24px rgba(64, 224, 255, 0.2);
      margin-bottom: 18px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 32px;
      color: #ff4c57;
    }
    .note {
      margin: 0 0 24px;
      color: #a8c4d8;
      font-size: 15px;
      line-height: 1.55;
    }
    .btn {
      width: 100%;
      border: 0;
      border-radius: 20px;
      padding: 19px 16px;
      font-size: 28px;
      font-weight: 800;
      color: white;
      background: linear-gradient(135deg, #ff3e4d 0%, #ff9f22 100%);
      box-shadow: 0 12px 30px rgba(255, 93, 62, 0.28);
      cursor: pointer;
    }
    .btn:disabled {
      opacity: 0.62;
      cursor: not-allowed;
    }
    .status {
      margin-top: 18px;
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 700;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      color: #bdd5e5;
    }
    .status.loading { color: #d9f6ff; border-color: rgba(79, 230, 255, 0.28); }
    .status.ok { color: #caffdf; border-color: rgba(74, 224, 140, 0.38); }
    .status.err { color: #ffd1d1; border-color: rgba(255, 105, 105, 0.45); }
    .footer {
      margin-top: 16px;
      font-size: 12px;
      color: #6f96ad;
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="icon" src="/icon.png" alt="启动倒数" />
    <h1>启动倒数</h1>
    <p class="note">确认 Make 已设好本场直播 Post ID，并保持 Active。</p>

    <button id="startBtn" class="btn">▶ 启动倒数</button>
    <div id="status" class="status">准备就绪</div>
    <div class="footer">Lover Legend Gardening</div>
  </main>

  <script>
    const btn = document.getElementById('startBtn');
    const status = document.getElementById('status');

    function showStatus(type, text) {
      status.className = 'status' + (type ? ' ' + type : '');
      status.textContent = text;
    }

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      btn.textContent = '⏳ 启动中...';
      showStatus('loading', '正在启动倒数...');

      try {
        const response = await fetch('/api/trigger', {
          method: 'GET',
          cache: 'no-store'
        });
        const data = await response.json();

        if (!response.ok || data.success !== true) {
          throw new Error(data.message || '启动失败');
        }

        showStatus('ok', '✅ 已启动倒数');
        btn.textContent = '▶ 再次启动';
      } catch (error) {
        showStatus('err', '❌ ' + (error.message || '启动失败，请重试'));
        btn.textContent = '▶ 再次启动';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
