<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>启动倒数</title>
  <link rel="icon" href="/icon.png" />
  <link rel="apple-touch-icon" href="/icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="启动倒数" />
  <meta name="theme-color" content="#081725" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(180deg, #16344d 0%, #081725 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #eef8ff;
    }
    .card {
      width: min(92vw, 430px);
      text-align: center;
      padding: 32px 22px 26px;
      border-radius: 28px;
      background: rgba(8, 24, 40, 0.9);
      border: 1px solid rgba(124, 211, 255, 0.25);
      box-shadow: 0 18px 55px rgba(0,0,0,0.36);
    }
    .icon {
      width: 118px;
      height: 118px;
      border-radius: 28px;
      object-fit: cover;
      box-shadow: 0 0 24px rgba(64, 224, 255, 0.2);
      margin-bottom: 18px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 32px;
      color: #ff4c57;
    }
    .note {
      margin: 0 0 24px;
      color: #a8c4d8;
      font-size: 15px;
      line-height: 1.55;
    }
    .btn {
      width: 100%;
      border: 0;
      border-radius: 20px;
      padding: 19px 16px;
      font-size: 28px;
      font-weight: 800;
      color: white;
      background: linear-gradient(135deg, #ff3e4d 0%, #ff9f22 100%);
      box-shadow: 0 12px 30px rgba(255, 93, 62, 0.28);
      cursor: pointer;
    }
    .btn:disabled { opacity: 0.62; cursor: not-allowed; }
    .end-btn {
      width: 100%;
      margin-top: 12px;
      border: 1px solid rgba(255,255,255,0.13);
      border-radius: 16px;
      padding: 13px 14px;
      font-size: 16px;
      font-weight: 800;
      color: #dce9f2;
      background: rgba(255,255,255,0.07);
      cursor: pointer;
    }
    .end-btn:disabled { opacity: 0.42; cursor: not-allowed; }
    .status {
      margin-top: 18px;
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 700;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      color: #bdd5e5;
      white-space: pre-line;
    }
    .status.loading { color: #d9f6ff; border-color: rgba(79, 230, 255, 0.28); }
    .status.ok { color: #caffdf; border-color: rgba(74, 224, 140, 0.38); }
    .status.err { color: #ffd1d1; border-color: rgba(255, 105, 105, 0.45); }
    .status.locked { color: #ffe3a6; border-color: rgba(255, 187, 73, 0.42); }
    .footer { margin-top: 16px; font-size: 12px; color: #6f96ad; }

    .overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 22px;
      background: rgba(0,0,0,0.68);
      z-index: 10;
    }
    .overlay.show { display: flex; }
    .confirm-box {
      width: min(92vw, 390px);
      padding: 24px 20px 20px;
      border-radius: 22px;
      background: #10283c;
      border: 1px solid rgba(124, 211, 255, 0.32);
      box-shadow: 0 18px 50px rgba(0,0,0,0.5);
      text-align: center;
    }
    .confirm-box h2 { margin: 0 0 10px; font-size: 24px; }
    .confirm-box p { margin: 0 0 18px; color: #bcd4e4; line-height: 1.55; }
    .confirm-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .confirm-actions button {
      border: 0;
      border-radius: 14px;
      padding: 14px 10px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }
    .cancel { background: #365066; color: #edf7ff; }
    .confirm { background: linear-gradient(135deg, #ff3e4d 0%, #ff9f22 100%); color: white; }
  </style>
</head>
<body>
  <main class="card">
    <img class="icon" src="/icon.png" alt="启动倒数" />
    <h1>启动倒数</h1>
    <p class="note">新 Post 第一次需要确认；同一 Post 后续可直接再次启动。</p>

    <button id="startBtn" class="btn">▶ 启动倒数</button>
    <button id="endBtn" class="end-btn" disabled>🔒 结束本场直播</button>
    <div id="status" class="status">准备就绪</div>
    <div class="footer">Lover Legend Gardening · V6.3</div>
  </main>

  <div id="startOverlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="startConfirmTitle">
    <div class="confirm-box">
      <h2 id="startConfirmTitle">确认第一次启动？</h2>
      <p>这是新的 Facebook Post。确认后，本 Post 后续再次启动将不再询问。</p>
      <div class="confirm-actions">
        <button id="startCancelBtn" class="cancel">取消</button>
        <button id="startConfirmBtn" class="confirm">确认启动</button>
      </div>
    </div>
  </div>

  <div id="endOverlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="endConfirmTitle">
    <div class="confirm-box">
      <h2 id="endConfirmTitle">结束本场直播？</h2>
      <p>锁定当前 Post 后，再误触「启动倒数」也不会执行；检测到新的 Post ID 会自动解锁。</p>
      <div class="confirm-actions">
        <button id="endCancelBtn" class="cancel">取消</button>
        <button id="endConfirmBtn" class="confirm">确认结束</button>
      </div>
    </div>
  </div>

  <script>
    const CONFIRMED_KEY = 'systemon_confirmed_post_id_v63';
    const ENDED_KEY = 'systemon_ended_post_id_v63';

    const startBtn = document.getElementById('startBtn');
    const endBtn = document.getElementById('endBtn');
    const status = document.getElementById('status');
    const startOverlay = document.getElementById('startOverlay');
    const endOverlay = document.getElementById('endOverlay');
    const startCancelBtn = document.getElementById('startCancelBtn');
    const startConfirmBtn = document.getElementById('startConfirmBtn');
    const endCancelBtn = document.getElementById('endCancelBtn');
    const endConfirmBtn = document.getElementById('endConfirmBtn');

    let pendingPostId = '';

    function showStatus(type, text) {
      status.className = 'status' + (type ? ' ' + type : '');
      status.textContent = text;
    }

    function setBusy(isBusy, text) {
      startBtn.disabled = isBusy;
      if (text) startBtn.textContent = text;
    }

    function syncEndButton() {
      const confirmed = localStorage.getItem(CONFIRMED_KEY) || '';
      const ended = localStorage.getItem(ENDED_KEY) || '';
      endBtn.disabled = !confirmed || confirmed === ended;
    }

    async function getLatestPost() {
      const response = await fetch('/api/trigger', { method: 'GET', cache: 'no-store' });
      const data = await response.json();
      if (!response.ok || data.success !== true) {
        throw new Error(data.message || '无法检查最新贴文');
      }
      return data;
    }

    async function triggerPost(postId) {
      const response = await fetch('/api/trigger', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        cache: 'no-store',
        body: JSON.stringify({ post_id: postId })
      });
      const data = await response.json();
      if (!response.ok || data.success !== true) {
        if (data.post_changed) {
          localStorage.removeItem(CONFIRMED_KEY);
        }
        throw new Error(data.message || '启动失败');
      }
      return data;
    }

    async function doTrigger(postId, rememberConfirmation) {
      startOverlay.classList.remove('show');
      setBusy(true, '⏳ 启动中...');
      showStatus('loading', '正在启动倒数...');

      try {
        await triggerPost(postId);
        if (rememberConfirmation) {
          localStorage.setItem(CONFIRMED_KEY, postId);
        }
        showStatus('ok', '✅ 已启动倒数');
        startBtn.textContent = '▶ 再次启动';
        syncEndButton();
      } catch (error) {
        showStatus('err', '❌ ' + (error.message || '启动失败，请重试'));
        startBtn.textContent = '▶ 启动倒数';
      } finally {
        startBtn.disabled = false;
        pendingPostId = '';
      }
    }

    startBtn.addEventListener('click', async () => {
      setBusy(true, '⏳ 检查中...');
      showStatus('loading', '正在检查最新 Facebook Post...');

      try {
        const latest = await getLatestPost();
        const confirmedPostId = localStorage.getItem(CONFIRMED_KEY) || '';
        const endedPostId = localStorage.getItem(ENDED_KEY) || '';

        // New Post ID automatically clears the previous ended/confirmed state.
        if (endedPostId && endedPostId !== latest.post_id) {
          localStorage.removeItem(ENDED_KEY);
          localStorage.removeItem(CONFIRMED_KEY);
        }

        const currentEndedPostId = localStorage.getItem(ENDED_KEY) || '';
        if (currentEndedPostId === latest.post_id) {
          showStatus('locked', '🔒 本场直播已结束，当前 Post 已锁定');
          startBtn.textContent = '▶ 启动倒数';
          startBtn.disabled = false;
          syncEndButton();
          return;
        }

        if (confirmedPostId === latest.post_id) {
          await doTrigger(latest.post_id, false);
          return;
        }

        // New Post ID: clear old confirmation and ask once.
        localStorage.removeItem(CONFIRMED_KEY);
        pendingPostId = latest.post_id;
        showStatus('', '等待确认');
        startBtn.textContent = '▶ 启动倒数';
        startBtn.disabled = false;
        startOverlay.classList.add('show');
      } catch (error) {
        showStatus('err', '❌ ' + (error.message || '检查失败，请重试'));
        startBtn.textContent = '▶ 启动倒数';
        startBtn.disabled = false;
      }
    });

    startCancelBtn.addEventListener('click', () => {
      startOverlay.classList.remove('show');
      pendingPostId = '';
      showStatus('', '已取消');
    });

    startConfirmBtn.addEventListener('click', async () => {
      if (!pendingPostId) {
        startOverlay.classList.remove('show');
        showStatus('err', '❌ Post ID 已失效，请重新点击启动');
        return;
      }
      startConfirmBtn.disabled = true;
      try {
        await doTrigger(pendingPostId, true);
      } finally {
        startConfirmBtn.disabled = false;
      }
    });

    endBtn.addEventListener('click', () => {
      const confirmedPostId = localStorage.getItem(CONFIRMED_KEY) || '';
      if (!confirmedPostId) {
        showStatus('err', '❌ 目前没有已确认的 Post');
        return;
      }
      endOverlay.classList.add('show');
    });

    endCancelBtn.addEventListener('click', () => {
      endOverlay.classList.remove('show');
    });

    endConfirmBtn.addEventListener('click', () => {
      const confirmedPostId = localStorage.getItem(CONFIRMED_KEY) || '';
      endOverlay.classList.remove('show');
      if (!confirmedPostId) {
        showStatus('err', '❌ 目前没有已确认的 Post');
        return;
      }
      localStorage.setItem(ENDED_KEY, confirmedPostId);
      showStatus('locked', '🔒 本场直播已结束，当前 Post 已锁定');
      startBtn.textContent = '▶ 启动倒数';
      syncEndButton();
    });

    syncEndButton();
  </script>
</body>
</html>
